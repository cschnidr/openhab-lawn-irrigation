name: Validate openHAB configuration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-scripts:
    name: Validate shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck openhab/scripts/rain_yesterday.sh
          shellcheck openhab/scripts/rain_lastNdays.sh

      - name: Test rain_yesterday.sh (live fetch)
        run: |
          result=$(bash openhab/scripts/rain_yesterday.sh)
          echo "Yesterday's rain at OPF: $result mm"
          # sanity check: result must be a number
          echo "$result" | grep -E '^[0-9]+\.[0-9]+$'
        env:
          METEO_STATION: opf

      - name: Test rain_lastNdays.sh (live fetch)
        run: |
          result=$(bash openhab/scripts/rain_lastNdays.sh)
          echo "7-day rain at OPF: $result mm"
          echo "$result" | grep -E '^[0-9]+\.[0-9]+$'
        env:
          METEO_STATION: opf
          METEO_DAYS: 7

  validate-markdown:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc_config.json'
        continue-on-error: true   # don't fail on external link timeouts
